<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline - InternGuide</title>
    <style>
      /* self-contained so it renders with no network at all */
      * { margin: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: #f7faf9;
        color: #18251f;
      }
      .card {
        max-width: 22rem;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: #e6f2ec;
      }
      h1 { font-size: 1.35rem; margin-bottom: 0.5rem; }
      p { color: #4b5563; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #18815a;
        border: 0;
        border-radius: 10px;
        padding: 0.7rem 1.4rem;
        cursor: pointer;
      }
      button:hover { background: #106045; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#18815a"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>
        No internet connection right now. Pages you've already opened still work -
        or try again once you're back online.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
